<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>清单审查</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#5c5c5c;font:14px/30px "PingFang SC",Helvetica,Arial,Verdana,"Microsoft YaHei",sans-serif}main{padding:8px 16px 0}.table-wrap{overflow-x:auto}table{width:100%;min-width:1360px;table-layout:fixed;border-collapse:collapse}th,td{height:41px;padding:9px 12px;border-bottom:1px solid #ebebeb;text-align:left;vertical-align:middle;line-height:22px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{color:#858585;background:#fafafa}tbody tr:nth-child(even){background:#f4f9fe}tbody tr:hover{background:#f5f5f5}td:nth-child(2){padding-left:22px}th:first-child{width:65px}th:nth-child(2){width:280px}th:nth-child(3),th:nth-child(4),th:nth-child(5){width:185px}th:nth-child(6){width:150px}th:nth-child(7){width:110px}th:last-child{width:130px}.pager{display:flex;justify-content:flex-end;align-items:center;gap:4px;padding:8px 0;white-space:nowrap}.pager button,.pager select,.pager input{height:28px;border:1px solid #d6d6d6;border-radius:4px;background:#fff;color:#5c5c5c;font:inherit;line-height:26px}.pager button{min-width:28px;padding:0 6px;display:grid;place-items:center}.pager button:disabled{color:#c9cdd2;cursor:not-allowed}.pager .current{color:#2590eb;border-color:#2590eb}.pager select{width:86px;margin-left:4px}.pager input{width:36px;text-align:center}.pager label{display:flex;align-items:center;gap:4px}.jump,.total{margin-left:12px}.pager svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}:focus-visible{outline:2px solid #2590eb;outline-offset:2px}::selection{background:#2590eb;color:white}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body><main><div class="table-wrap"><table><caption class="sr-only">清单审查示例数据</caption><thead><tr><th scope="col">序号</th><th scope="col">单位名称</th><th scope="col">清单符合性检查</th><th scope="col">措施项目符合性检查</th><th scope="col">其它项目符合性检查</th><th scope="col">计算错误检查</th><th scope="col">取费检查</th><th scope="col">清标结果</th></tr></thead><tbody id="rows"></tbody></table></div><nav class="pager" aria-label="分页"><button disabled aria-label="上一页"><svg viewBox="0 0 20 20"><path d="m12.5 4.5-5 5.5 5 5.5"/></svg></button><button class="current" aria-current="page">1</button><button disabled aria-label="下一页"><svg viewBox="0 0 20 20"><path d="m7.5 4.5 5 5.5-5 5.5"/></svg></button><select aria-label="每页条数"><option>10 条/页</option><option>20 条/页</option><option>50 条/页</option></select><label class="jump">跳至<input value="1" type="number" min="1" max="1" aria-label="跳转页码">页</label><span class="total" id="total"></span></nav></main>
<script src="matrix-data.js"></script><script>
const unit=new URLSearchParams(location.search).get('unit');
const {companies,selves}=window.MatrixData;
const records=selves.filter(item=>!unit||companies[item.a][0]===unit);
records.forEach((item,i)=>{const row=document.createElement('tr');[i+1,companies[item.a][0],...item.review.checks,item.review.result].forEach(value=>{const cell=document.createElement('td');cell.textContent=String(value);cell.title=String(value);row.appendChild(cell);});document.getElementById('rows').appendChild(row);});
if(!records.length){const row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=8;cell.textContent='暂无对应单位的数据';row.appendChild(cell);document.getElementById('rows').appendChild(row);}
document.getElementById('total').textContent='共'+records.length+'条';
</script></body></html>
